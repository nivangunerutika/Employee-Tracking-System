server.port=8080
# H2 file database (data is saved in ./data folder, no installation needed)
spring.datasource.url=jdbc:h2:file:./data/peopledesk
spring.datasource.username=root
spring.datasource.password=Root
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
server.error.include-message=always

# ---- To use MySQL instead, comment the H2 lines above and use these ----
# spring.datasource.url=jdbc:mysql://localhost:3306/peopledesk?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# (also add mysql-connector-j dependency in pom.xml)
